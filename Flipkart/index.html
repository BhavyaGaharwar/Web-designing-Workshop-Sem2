<!DOCTYPE html>
<html>

<head>

<title>Flipkart Clone</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#f1f3f6;
}

.navbar{
background:#2874f0;

display:flex;

justify-content:space-between;

align-items:center;

padding:15px 40px;
}

.logo{
color:white;

font-size:35px;

font-weight:bold;
}

.search{
width:50%;

padding:12px;

border:none;

border-radius:6px;
}

.cart{

background:white;

padding:10px 20px;

border-radius:6px;

font-weight:bold;
}

.banner{

background:#ff9f00;

color:white;

text-align:center;

padding:35px;

font-size:40px;
}

.categories{

background:white;

display:flex;

justify-content:center;

gap:40px;

padding:20px;
}

.category{

font-size:20px;

}

.products{

display:flex;

flex-wrap:wrap;

justify-content:center;

gap:20px;

padding:25px;
}

.card{

background:white;

width:260px;

padding:15px;

border-radius:10px;

box-shadow:0 0 10px lightgray;

text-align:center;
}

.card img{

width:100%;

height:250px;

object-fit:contain;

}

.buy{

background:#2874f0;

color:white;

border:none;

padding:12px;

width:100%;

cursor:pointer;

border-radius:5px;
}

footer{

background:#172337;

color:white;

padding:20px;

text-align:center;

}

</style>

</head>

<body>

<div id="root"></div>

<script>

const e=React.createElement;

function App(){

const [cart,setCart]=React.useState(0);

const products=[

{
name:"iPhone 15",
price:"₹69999",
img:"https://m.media-amazon.com/images/I/71d7rfSl0wL._SX679_.jpg"
},

{
name:"MacBook Air",
price:"₹89999",
img:"https://m.media-amazon.com/images/I/71TPda7cwUL._SX679_.jpg"
},

{
name:"Nike Shoes",
price:"₹4999",
img:"https://images.pexels.com/photos/2529148/pexels-photo-2529148.jpeg"
},

{
name:"Sony Headphones",
price:"₹2999",
img:"https://images.pexels.com/photos/3394650/pexels-photo-3394650.jpeg"
}

];

return React.createElement(

"div",

null,

React.createElement(

"div",

{className:"navbar"},

React.createElement(
"div",
{className:"logo"},
"🛒 Flipkart"
),

React.createElement(
"input",
{
className:"search",
placeholder:"Search Products"
}
),

React.createElement(
"div",
{className:"cart"},
"Cart : "+cart
)

),

React.createElement(
"div",
{className:"banner"},
"BIG BILLION DAYS"
),

React.createElement(

"div",

{className:"categories"},

["📱 Mobiles","💻 Electronics","👗 Fashion","💄 Beauty","🧸 Toys"]

.map(item=>

React.createElement(
"div",
{className:"category"},
item
)

)

),

React.createElement(

"div",

{className:"products"},

products.map(p=>

React.createElement(

"div",

{
className:"card"
},

React.createElement(
"img",
{
src:p.img
}
),

React.createElement(
"h2",
null,
p.name
),

React.createElement(
"h3",
null,
p.price
),

React.createElement(

"button",

{

className:"buy",

onClick:()=>setCart(cart+1)

},

"Add To Cart"

)

)

)

),

React.createElement(
"footer",
null,
"Flipkart Clone Project"
)

);

}

ReactDOM
.createRoot(
document.getElementById("root")
)
.render(
React.createElement(App)
);

</script>

</body>

</html>
