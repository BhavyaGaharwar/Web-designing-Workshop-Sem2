<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Of Even Numbers</title>
    <style>
        body{
            background:rgb(243, 209, 209);
            padding:10px;
            text-align:center;
            font-family:Ariel;
        }
        .container{
            background:rgb(241, 125, 107);
            width:100%;
            padding:10px;
            border:20px;
            box-shadow:0px 0px 5px gray;
        }
        input{
            width:80%;
            font-size:8px;
            padding:10px;
            font-weight:bold;
        }
        button{
            background:rgb(68, 231, 65);
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }
        button:hover{
            background-color:rgb(74, 242, 82);
        }
        h2{
            font-size:15px;
            border:20px;
            padding:10px;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sum Of Even Numbers</h1>
        <input type="number" id="num" placeholder="Enter value of N">
        <br><br>

        <button onclick="calculateSum()">Calculate</button>
        <h2 id="result"></h2>

    </div>

    <script>
        function calculateSum()
        {
            let n=parseInt(document.getElementById("num").value);
            let sum=0;

            if(isNaN(n)||n<=0)
        {
            document.getElementById("result").innerHTML="Please eneter a valid positive number";
            return;
        }

        for(let i=1; i<=n; i++)
        {
            if(i%2==0)
         {
            sum=sum+i;
         } 
        }
        document.getElementById("result").innerHTML="Sum of even numbers from 1 to" +n+ "is" + sum;
        }
    </script>
    
</body>
</html>
